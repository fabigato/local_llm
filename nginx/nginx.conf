events {}

http {
    # http-global. Must be set before any `map` block in conf.d/ is parsed (nginx
    # reads it when building each map's hash), so it lives here, before the include,
    # rather than in a per-service template. Bumped from the default 64 because the
    # bearer-token maps use long "Bearer <token>" keys (see 00-whisper / 01-ollama).
    map_hash_bucket_size 128;

    include /etc/nginx/conf.d/*.conf;
}
