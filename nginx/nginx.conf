events {}

http {
    # http-global. Must be set before any `map` block in conf.d/ is parsed (nginx
    # reads it when building each map's hash), so it lives here, before the include,
    # rather than in a per-service template. Bumped from the default 64 because the
    # bearer-token maps use long "Bearer <token>" keys (see 00-whisper / 01-ollama).
    map_hash_bucket_size 128;

    # ------------------------------------------------------------------------
    # TLS — one wildcard certificate, declared once, inherited by every server
    # block below. Covers DOMAIN and *.DOMAIN, so adding a subdomain needs no
    # certificate work at all: write a server block, done.
    #
    # The cert is deliberately named "wildcard" instead of after the domain
    # (certbot --cert-name wildcard). This file is mounted verbatim, NOT run
    # through envsubst like nginx/templates/*, so the path can't contain
    # ${DOMAIN} — a fixed name is what lets the declaration live up here instead
    # of being repeated in all four server blocks. It also keeps the real domain
    # out of file paths.
    #
    # Consequence worth knowing: nginx will refuse to START if these files are
    # missing, so issue the certificate before the first `docker compose up`
    # (scripts/certbot-issue.sh).
    ssl_certificate     /etc/letsencrypt/live/wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # With TLS 1.3 the client's cipher preference is the sane default.
    ssl_prefer_server_ciphers off;
    # Shared across workers, so resumed handshakes skip the full key exchange.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;
}
