# /etc/newsyslog.d/llmster.conf — rotation for the LM Studio daemon's logs.
#
# Owner is fabigato because local.llmster runs as fabigato and the wrapper
# appends to llmster-server.log itself. The launchd log takes llmster's DEBUG
# console output, so it gets a bigger cap. Size-triggered, like jellyfin.conf.
#
# Dry-run a change with:  sudo newsyslog -nvv -f /etc/newsyslog.d/llmster.conf
#
# logfilename                        [owner:group]  mode count size(KB) when flags
/var/log/llmster-server.log          fabigato:staff 644  4     512     *    JC
/var/log/llmster-server.launchd.log  fabigato:staff 644  3     10240   *    JC
