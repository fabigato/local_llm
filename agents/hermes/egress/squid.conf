# Egress proxy for the hermes container: its ONLY route out (hermes sits on an
# internal-only network). Allows the public internet on 80/443 and refuses any
# destination that resolves to a private, loopback, link-local, CGNAT/Tailscale
# or Docker Desktop address — i.e. this Mac, the LAN and the tailnet.
# Squid checks the resolved IP, so hostnames like host.docker.internal or a DNS
# name pointing at 192.168.x.x are refused too.

http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl to_private dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16
acl to_private dst 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl to_private dst ::1 fc00::/7 fe80::/10

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_private
http_access deny to_localhost
# Reachable only from the compose networks (port 3128 is not published).
http_access allow all

# Pure forwarder: no disk cache. Logs stay at the image defaults
# (/var/log/squid/{access,cache}.log): squid runs as `proxy` and can't open
# /dev/stdout.
cache deny all
forwarded_for delete
via off
